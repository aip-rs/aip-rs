[workspace]
members = [".", "aip-160", "aip-193", "aip-193-derive"]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["AprilNEA <github@sku.moe>"]
license = "MIT or Apache-2.0"
repository = "https://github.com/AprilNEA/aip"
homepage = "https://github.com/AprilNEA/aip"

[package]
name = "aip"
description = "A Rust implementation of Google AIP-160 HTTP Paths and AIP-193 Errors."
version = "0.2.2"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[features]
default = []
derive = ["aip-193/derive"]

axum = ["aip-193/axum", "aip-193/derive"]

[dependencies]
aip-160 = { version = "0.1.5", path = "aip-160" }
aip-193 = { version = "0.2.2", path = "aip-193" }
