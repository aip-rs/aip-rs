[package]
name = "aip-193"
version = "0.2.8"
description = "A Rust implementation of Google AIP-193 Errors, with optional protobuf google.rpc types."
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
# The generator is a separate crate that runs on demand.
exclude = ["codegen"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["http"]
derive = ["aip-193-derive"]

http = ["dep:http"]

axum = ["dep:axum-core", "dep:serde_json", "http"]
utoipa = ["dep:utoipa"]
# Protobuf `google.rpc` types generated with buffa, in `aip_193::proto`.
proto = ["dep:buffa", "dep:buffa-types"]
# Conversions between `aip_193::proto::Status` and `connectrpc::ConnectError`.
connectrpc = ["proto", "dep:connectrpc", "dep:base64"]

[dependencies]
aip-193-derive = { version = "0.2.2", path = "../aip-193-derive", optional = true }

http = { version = "1.0", optional = true }

axum-core = { version = "0.5", optional = true }
utoipa = { version = "5", optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
strum = { version = "0.26", features = ["derive"] }
buffa = { version = "0.9", features = ["json"], optional = true }
buffa-types = { version = "0.9", features = ["json"], optional = true }
connectrpc = { version = "0.9", default-features = false, optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
serde_json = "1.0"
http = "1.0"
