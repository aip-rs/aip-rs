[package]
name = "aip-160"
version = "0.2.0"
description = "A Rust implementation of Google AIP-160 filtering standard."
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

[features]
default = []
sea-orm = ["dep:sea-orm"]

[dependencies]
thiserror = "2.0"

sea-orm = { version = "2.0", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "2.0", default-features = false, features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-sqlite",
    "with-chrono",
    "with-uuid",
] }

[[example]]
name = "parser"

[[example]]
name = "sea_orm"
required-features = ["sea-orm"]
